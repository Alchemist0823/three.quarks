<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>babylon.quarks – Particle System Demo</title>
    <link rel="shortcut icon" href="./favicon.png"/>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#000000"/>
    <meta name="description" content="babylon.quarks particle system demo for Babylon.js">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; display: block; }

        .back-link {
            position: fixed;
            top: 16px;
            left: 16px;
            color: white;
            text-decoration: none;
            font-family: sans-serif;
            font-size: 14px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            z-index: 100;
            transition: background 0.2s;
        }
        .back-link:hover { background: rgba(255, 255, 255, 0.2); }

        #demo-name {
            font-weight: bold;
            font-family: sans-serif;
            color: white;
            z-index: 10;
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            padding: 8px 24px;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
        }

        .btn {
            color: white;
            font-size: 3em;
            cursor: pointer;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            padding: 10px;
            user-select: none;
        }
        .next { right: 10px; }
        .previous { left: 10px; }

        #stats {
            position: fixed;
            top: 16px;
            right: 16px;
            color: white;
            font-family: monospace;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 8px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <a href="./" class="back-link">← Back to Examples</a>
    <div id="stats">Particles: <span id="particleCount">0</span> | FPS: <span id="fps">0</span></div>
    <canvas id="renderCanvas"></canvas>
    <div id="demo-name">Loading...</div>
    <div id="nextBtn" class="next btn">&#62;</div>
    <div id="previousBtn" class="previous btn">&#60;</div>
    <script type="module" src="./babylonMain.js"></script>
</body>
</html>
