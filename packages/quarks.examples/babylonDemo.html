<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>babylon.quarks – Particle System Demo</title>
    <link rel="shortcut icon" href="./favicon.png"/>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#000000"/>
    <meta name="description" content="babylon.quarks particle system demo for Babylon.js">
    <style>
        :root {
            color-scheme: light dark;
        }

        body {
            margin: 0;
            padding: 0;
        }

        #demo-name {
            font-weight: bold;
            font-family: sans-serif;
            color: white;
            z-index: 10;
            position: relative;
            text-align: center;
            margin: 0 auto;
            padding: 16px;
        }

        #renderer-canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
            touch-action: none;
            display: block;
        }

        .btn {
            color: white;
            border: white 1px;
            font-size: 3em;
            cursor: pointer;
            user-select: none;
        }

        .next {
            position: absolute;
            top: 50%;
            right: 0;
            z-index: 10;
        }

        .previous {
            position: absolute;
            top: 50%;
            z-index: 10;
        }

        .back-link {
            position: fixed;
            top: 16px;
            left: 16px;
            color: white;
            text-decoration: none;
            font-family: sans-serif;
            font-size: 14px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            z-index: 100;
            transition: background 0.2s;
            cursor: pointer;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .source-link {
            position: fixed;
            top: 16px;
            right: 16px;
            color: white;
            text-decoration: none;
            font-family: sans-serif;
            font-size: 14px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            z-index: 100;
            transition: background 0.2s;
            cursor: pointer;
        }

        .source-link:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #stats {
            position: fixed;
            top: 56px;
            right: 16px;
            color: white;
            font-family: monospace;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 12px;
            border-radius: 8px;
            z-index: 100;
        }
    </style>
</head>
<body id="home">
    <a href="./" class="back-link">← Back to Examples</a>
    <a id="source-link" href="https://github.com/Alchemist0823/three.quarks/blob/master/packages/quarks.examples/babylonMain.js" target="_blank" class="source-link">View Source Code</a>
    <div id="stats">Particles: <span id="particleCount">0</span> | FPS: <span id="fps">0</span></div>
    <canvas id="renderer-canvas"></canvas>
    <div id="demo-name">Loading...</div>
    <div id="nextBtn" class="next btn">&#62;</div>
    <div id="previousBtn" class="previous btn">&#60;</div>
    <script type="module" src="./babylonMain.js"></script>
</body>
</html>
